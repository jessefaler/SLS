# Default config

app_name: "SLS"

debug: false

telemetry_enabled: true

system:
  root_directory: "/var/lib/sls"
  log_directory: "/var/log/sls/protocube"
  volumes: "/var/lib/sls/volumes"
  blueprints: "/var/lib/sls/blueprints"
  software: "/var/lib/sls/software"
  plugins: "/var/lib/sls/plugins"

# Optional remote blueprint sources. Each source is synced to disk under
# system.blueprints before blueprints are loaded (and on reload by default).
#
# blueprint:
#   sources:
#     - type: git
#       url: "https://github.com/org/sls-blueprints.git"
#       ref: "main"
#       path: "."
#       dest: "."
#       auth:
#         token: "ghp_..."           # optional; GITHUB_TOKEN env is preferred
#       update_on_reload: true
blueprint:
  sources: []

api:
  host: "0.0.0.0"
  port: 5620
  tls:
    enabled: true
    cert: "/etc/ssl/certs/cert.pem"
    key: "/etc/ssl/certs/key.pem"

# Default config

app_name: "SLS"

debug: false

api:
  host: "0.0.0.0"
  port: 5620
  tls:
    enabled: true
    cert: "/etc/protocube/cert.pem"
    key: "/etc/protocube/key.pem"

plugins-folder: "/var/lib/protocube/plugins"

system:
  root_directory: "/var/lib/protocube"
  log_directory: "/var/log/protocube"

blueprints:
  root: "/var/lib/protocube/blueprints"

software:
  root: "/var/lib/protocube/software"

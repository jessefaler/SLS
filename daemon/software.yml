# servers.yaml
# This file defines software types and their boot completion markers and stop commands.
# Each entry must include its software name explicitly.

paper:
  software: "Paper"
  docker-image: "ubuntu:20.04"
  stop-command: "stop"       # The command that should be sent to server processes to stop them gracefully. If you need to send a SIGINT you should enter ^C here.
  done: ")! For help, type " # This should be console output to look for when the server is done booting

spigot:
  software: "Spigot"
  docker-image: "ubuntu:20.04"
  stop-command: "stop"       # The command that should be sent to server processes to stop them gracefully. If you need to send a SIGINT you should enter ^C here.
  done: ")! For help, type " # This should be console output to look for when the server is done booting

pumpkin:
  software: "Pumpkin"
  docker-image: "ubuntu:20.04"
  stop-command: "stop"       # The command that should be sent to server processes to stop them gracefully. If you need to send a SIGINT you should enter ^C here.
  done: "Server is now running. Connect using port:" # This should be console output to look for when the server is done booting
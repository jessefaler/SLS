# Blueprint metadata
blueprint:
  id: 'makers_wars'
  name: 'Makers Wars'
  type: 'minigame'

# World configuration
world:
  name: 'Makers Wars'
  authors: 'Minemakers Team'
  path: 'minigames/makers_wars'

# Server configuration
server:
  version: '1.20.2'
  path: 'paper/paper-1.21.5'
  allowed_clients: '1.12-1.21'

  limits:
    memory_limit: 4096
    swap: 1024
    io_weight: 500
    cpu_limit: 200
    disk_space: 10000
    threads: '0-3'
    oom_disabled: false

  plugins:
    - name: 'WorldEdit'
      path: 'plugins/worldedit.jar'
    - name: 'EssentialsX'
      path: 'plugins/essentialsx.jar'

  configs:

    server.properties:
      parser: properties
      find:
        server-ip: '0.0.0.0'
        server-port: '{{server.build.default.port}}'
        motd: 'Welcome to Block Hunt!'

    spigot.yml:
      parser: yaml
      find:
        settings.bungeecord: true
        messages.restart: 'Server restarting...'

    paper.yml:
      parser: yaml
      find:
        timings.enabled: false
# Paper software configuration

software:
  id: 'paper'
  name: 'Paper'

  update:
    enabled: true
    url: https://github.com/jessefaler/SLS/blob/main/software/paper.yml

  images:
    "java_25": "ghcr.io/protoxon/images:java_25"
    "java_21": "ghcr.io/protoxon/images:java_21"
    "java_17": "ghcr.io/protoxon/images:java_17"
    "java_16": "ghcr.io/protoxon/images:java_16"
    "java_11": "ghcr.io/protoxon/images:java_11"
    "java_8": "ghcr.io/protoxon/images:java_8"

  mappings:
    - java_8:  "<=1.16.5"
    - java_16: ">=1.17 <=1.17.1"
    - java_17: ">=1.18 <=1.20.4"
    - java_21: ">=1.20.5 <=1.21.11"
    - java_25: ">=1.21.12"
    - default: java_25

  invocation: "java -Xms128M -XX:MaxRAMPercentage=95.0 -Dterminal.jline=false -Dterminal.ansi=true -XX:+PerfDisableSharedMem -XX:+ParallelRefProcEnabled -jar server.jar"
  stop-command: "stop"
  online-signal: ")! For help, type"

  install-script:
    entrypoint: bash
    script: "#!/bin/ash\n# Paper Installation Script\n#\n# Server Files: /home/container\nPROJECT=paper\nSERVER_JARFILE=server.jar\nUSER_AGENT=\"SLS (https://protoxon.github.io/sls-docs/)\"\n\nif [ -n \"${DL_PATH}\" ]; then\n  echo -e \"Using supplied download url: ${DL_PATH}\"\n  DOWNLOAD_URL=`eval echo $(echo ${DL_PATH} | sed -e 's/{{/${/g' -e 's/}}/}/g')`\nelse\n  VER_EXISTS=`curl --user-agent \"${USER_AGENT}\"  -s https://fill.papermc.io/v3/projects/${PROJECT} | jq -r --arg VERSION $VERSION '.versions | any(.[]; index($VERSION))' | grep -m1 true`\n  LATEST_VERSION=`curl --user-agent \"${USER_AGENT}\"  -s https://fill.papermc.io/v3/projects/${PROJECT} | jq -r '.versions | to_entries | .[0].value[0]'`\n\n  if [ \"${VER_EXISTS}\" == \"true\" ]; then\n    echo -e \"Version is valid. Using version ${VERSION}\"\n  else\n    echo -e \"Specified version not found. Defaulting to the latest ${PROJECT} version\"\n    VERSION=${LATEST_VERSION}\n  fi\n\n  BUILD_EXISTS=`curl --user-agent \"${USER_AGENT}\"  -s https://fill.papermc.io/v3/projects/${PROJECT}/versions/${VERSION} | jq -r --arg BUILD ${BUILD_NUMBER} '.builds[] | tostring | contains($BUILD)' | grep -m1 true`\n  LATEST_BUILD=`curl --user-agent \"${USER_AGENT}\"  -s https://fill.papermc.io/v3/projects/${PROJECT}/versions/${VERSION} | jq -r '.builds' | jq -r '.[0]'`\n\n  if [ \"${BUILD_EXISTS}\" == \"true\" ]; then\n    echo -e \"Build is valid for version ${VERSION}. Using build ${BUILD_NUMBER}\"\n  else\n    echo -e \"Using the latest ${PROJECT} build for version ${VERSION}\"\n    BUILD_NUMBER=${LATEST_BUILD}\n  fi\n\n  echo \"Version being downloaded\"\n  echo -e \"Project: ${PROJECT}\"\n  echo -e \"MC Version: ${VERSION}\"\n  echo -e \"Build: ${BUILD_NUMBER}\"\n  DOWNLOAD_URL=`curl --user-agent \"${USER_AGENT}\"  -s https://fill.papermc.io/v3/projects/${PROJECT}/versions/${VERSION}/builds/${BUILD_NUMBER} | jq -r '.downloads.\"server:default\".url'`\nfi\n\ncd /home/container\n\necho -e \"Running curl --user-agent \\\"${USER_AGENT}\\\"  -o ${SERVER_JARFILE} ${DOWNLOAD_URL}\"\n\nif [ -f ${SERVER_JARFILE} ]; then\n  mv ${SERVER_JARFILE} ${SERVER_JARFILE}.old\nfi\n\ncurl --user-agent \"${USER_AGENT}\"  -o ${SERVER_JARFILE} ${DOWNLOAD_URL}\n\n\necho \"Writing default server.properties file\"\ncat > server.properties <<EOF\nserver-port=25565\nserver-ip=\nmax-players=50\nmotd=SLS\nallow-nether=false\nonline-mode=false\nenable-command-block=true\nspawn-protection=0\nview-distance=12\nEOF\n\necho \"Writing default bukkit.yml file\"\ncat > bukkit.yml <<EOF\nsettings:\n  allow-end: false\nEOF\n\necho \"Writing default spigot.yml file\"\ncat > spigot.yml <<EOF\nsettings:\n  bungeecord: true\nEOF\n\nprintf \"\\033[1m\\033[33mcontainer@sls~ \\033[0mjava -version\\n\"\njava -version\n\necho \"Accepting the Minecraft EULA...\"\necho \"By continuing with this installation, you agree to the Minecraft EULA:\"\necho \"https://aka.ms/MinecraftEULA\"\necho \"eula=true\" > eula.txt"
    skip-scripts: false
    warmup: true
    warmup-timeout: 600
    warmup-retries: 0
    post-warmup-script: |
      rm -rf world world_nether world_the_end logs
    post-warmup-timeout: 120
    warmup_failure_policy: fail

  limits:
    memory_limit: 4096
    swap: 0
    io_weight: 500
    cpu_limit: 0
    disk_space: 8192
    threads: ""
    oom_disabled: true

  configs:
    server.properties:
      parser: properties
      find:
        server-ip: "0.0.0.0"
        server-port: "{{server.build.default.port}}"
        query.port: "{{server.build.default.port}}"

# Paper software configuration

software:
  id: 'paper'
  name: 'Paper'

  update:
    enabled: true
    url: https://github.com/jessefaler/SLS/blob/main/software/paper.yml

  images:
    "java_25": "ghcr.io/protoxon/images:java_25"
    "java_21": "ghcr.io/protoxon/images:java_21"
    "java_17": "ghcr.io/protoxon/images:java_17"
    "java_16": "ghcr.io/protoxon/images:java_16"
    "java_11": "ghcr.io/protoxon/images:java_11"
    "java_8": "ghcr.io/protoxon/images:java_8"

  mappings:
    - java_8:  "<=1.16.5"
    - java_16: ">=1.17 <=1.17.1"
    - java_17: ">=1.18 <=1.20.4"
    - java_21: ">=1.20.5 <=1.21.11"
    - java_25: ">=1.21.12"
    - default: java_21

  invocation: "java -Xms128M -XX:MaxRAMPercentage=95.0 -Dterminal.jline=false -Dterminal.ansi=true -XX:+PerfDisableSharedMem -XX:+ParallelRefProcEnabled -jar server.jar"
  stop-command: "stop"
  online-signal: ")! For help, type"

  install-script:
    entrypoint: bash
    script: |
      #!/bin/bash
      set -e

      PROJECT=paper
      : "${SERVER_JARFILE:=server.jar}"

      if [ -n "${DL_PATH}" ]; then
          echo -e "Using supplied download url: ${DL_PATH}"
          DOWNLOAD_URL=$(eval echo "$(echo "${DL_PATH}" | sed -e 's/{{/${/g' -e 's/}}/}/g')")
      else
          VER_EXISTS=$(curl -s "https://api.papermc.io/v2/projects/${PROJECT}" | jq -r --arg VERSION "${VERSION}" '.versions[] | contains($VERSION)' | grep -m1 true || true)
          LATEST_VERSION=$(curl -s "https://api.papermc.io/v2/projects/${PROJECT}" | jq -r '.versions' | jq -r '.[-1]')
          if [ "${VER_EXISTS}" = "true" ]; then
              echo -e "Version is valid. Using version ${VERSION}"
          else
              echo -e "Specified version not found. Defaulting to the latest ${PROJECT} version"
              VERSION=${LATEST_VERSION}
          fi

          BUILD_EXISTS=false
          if [ -n "${BUILD_NUMBER}" ]; then
              BUILD_EXISTS=$(curl -s "https://api.papermc.io/v2/projects/${PROJECT}/versions/${VERSION}" | jq -r --arg BUILD "${BUILD_NUMBER}" '.builds[] | tostring | . == $BUILD' | grep -m1 true || true)
          fi
          LATEST_BUILD=$(curl -s "https://api.papermc.io/v2/projects/${PROJECT}/versions/${VERSION}" | jq -r '.builds' | jq -r '.[-1]')
          if [ "${BUILD_EXISTS}" = "true" ]; then
              echo -e "Build is valid for version ${VERSION}. Using build ${BUILD_NUMBER}"
          else
              echo -e "Using the latest ${PROJECT} build for version ${VERSION}"
              BUILD_NUMBER=${LATEST_BUILD}
          fi

          JAR_NAME=${PROJECT}-${VERSION}-${BUILD_NUMBER}.jar
          echo -e "MC Version: ${VERSION}"
          echo -e "Build: ${BUILD_NUMBER}"
          echo -e "JAR Name of Build: ${JAR_NAME}"
          DOWNLOAD_URL=https://api.papermc.io/v2/projects/${PROJECT}/versions/${VERSION}/builds/${BUILD_NUMBER}/downloads/${JAR_NAME}
      fi

      cd /home/container
      echo -e "Running curl -o ${SERVER_JARFILE} ${DOWNLOAD_URL}"
      if [ -f "${SERVER_JARFILE}" ]; then
          mv "${SERVER_JARFILE}" "${SERVER_JARFILE}.old"
      fi
      curl -f -o "${SERVER_JARFILE}" "${DOWNLOAD_URL}"

      if [ ! -f "${SERVER_JARFILE}" ]; then
          echo "ERROR: Server jar not found after download. Aborting."
          exit 1
      fi

      cat > server.properties <<EOF
      server-port=25565
      server-ip=
      max-players=50
      motd=SLS
      allow-nether=false
      online-mode=false
      enable-command-block=true
      spawn-protection=0
      view-distance=12
      EOF

      cat > bukkit.yml <<EOF
      settings:
        allow-end: false
      EOF

      cat > spigot.yml <<EOF
      settings:
        bungeecord: true
      EOF

      printf "\033[1m\033[33mcontainer@sls~ \033[0mjava -version\n"
      java -version
      echo "eula=true" > eula.txt
    skip-scripts: false
    warmup: true
    warmup-timeout: 600
    warmup-retries: 0
    post-warmup-script: |
      rm -rf world world_nether world_the_end logs
    post-warmup-timeout: 120
    warmup_failure_policy: fail

  limits:
    memory_limit: 4096
    swap: 0
    io_weight: 500
    cpu_limit: 0
    disk_space: 8192
    threads: ""
    oom_disabled: true

  configs:
    server.properties:
      parser: properties
      find:
        server-ip: "0.0.0.0"
        server-port: "{{server.build.default.port}}"
        query.port: "{{server.build.default.port}}"

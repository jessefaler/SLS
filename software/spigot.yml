# Spigot Software configuration

software:
  id: 'spigot'
  name: 'Spigot'

  update:
    enabled: true
    url: https://github.com/jessefaler/SLS/blob/main/software/spigot.yml

  images:
    "java_25": "ghcr.io/protoxon/images:java_25"
    "java_21": "ghcr.io/protoxon/images:java_21"
    "java_17": "ghcr.io/protoxon/images:java_17"
    "java_16": "ghcr.io/protoxon/images:java_16"
    "java_11": "ghcr.io/protoxon/images:java_11"
    "java_8": "ghcr.io/protoxon/images:java_8"

  mappings:
    - java_8:  "<=1.16.5"
    - java_16: ">=1.17 <=1.17.1"
    - java_17: ">=1.18 <=1.20.4"
    - java_21: ">=1.20.5 <=1.21.11"
    - java_25: ">=1.21.12"
    - default: java_25

  invocation: "java -Xms128M -XX:MaxRAMPercentage=95.0 -Dterminal.jline=false -Dterminal.ansi=true -Ddisable.watchdog=true -jar server.jar"
  stop-command: "stop"
  online-signal: ")! For help, type"

  install-script:
    entrypoint: bash
    script: |
      #!/bin/bash
      set -e

      PROJECT=spigot
      : "${SERVER_JARFILE:=server.jar}"
      cd /home/container

      if [ -n "${DL_PATH}" ]; then
          echo -e "Using supplied download url: ${DL_PATH}"
          DOWNLOAD_URL=$(eval echo "$(echo "${DL_PATH}" | sed -e 's/{{/${/g' -e 's/}}/}/g')")
          echo -e "Running curl -o ${SERVER_JARFILE} ${DOWNLOAD_URL}"
          if [ -f "${SERVER_JARFILE}" ]; then
              mv "${SERVER_JARFILE}" "${SERVER_JARFILE}.old"
          fi
          curl -f -o "${SERVER_JARFILE}" "${DOWNLOAD_URL}"
      else
          : "${VERSION:=1.20.1}"
          echo -e "Building Spigot for Minecraft version ${VERSION}..."
          curl -L -f -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

          BUILD_MEM=1024
          if [ -n "${SERVER_MEMORY}" ] && [ "${SERVER_MEMORY}" -gt "${BUILD_MEM}" ] 2>/dev/null; then
              BUILD_MEM=${SERVER_MEMORY}
          fi

          echo -e "Running BuildTools with ${BUILD_MEM}M memory..."
          java -Xms${BUILD_MEM}M -XX:MaxRAMPercentage=80.0 -jar BuildTools.jar --rev "${VERSION}"

          if [ -f "${SERVER_JARFILE}" ]; then
              mv "${SERVER_JARFILE}" "${SERVER_JARFILE}.old"
          fi
          mv "spigot-${VERSION}.jar" "${SERVER_JARFILE}"
          rm -f BuildTools.jar
          rm -rf build
      fi

      if [ ! -f "${SERVER_JARFILE}" ]; then
          echo "ERROR: Server jar not found after download/build. Aborting."
          exit 1
      fi

      cat > server.properties <<EOF
      server-port=25565
      server-ip=
      max-players=50
      motd=SLS
      allow-nether=false
      online-mode=false
      enable-command-block=true
      spawn-protection=0
      view-distance=12
      EOF

      cat > bukkit.yml <<EOF
      settings:
        allow-end: false
      EOF

      cat > spigot.yml <<EOF
      settings:
        bungeecord: true
      EOF

      printf "\033[1m\033[33mcontainer@sls~ \033[0mjava -version\n"
      java -version
      echo "eula=true" > eula.txt
    warmup: true
    warmup-timeout: 600
    warmup-retries: 0
    post-warmup-script: |
      rm -rf world world_nether world_the_end logs
    post-warmup-timeout: 120
    warmup_failure_policy: fail

  limits:
    memory_limit: 4096
    swap: 0
    io_weight: 500
    cpu_limit: 0
    disk_space: 8192
    threads: ""
    oom_disabled: true

  configs:
    server.properties:
      parser: properties
      find:
        server-ip: "0.0.0.0"
        server-port: "{{server.build.default.port}}"
        query.port: "{{server.build.default.port}}"
